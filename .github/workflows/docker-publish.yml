name: Publish Docker image

# Builds the image from the Dockerfile for amd64 and arm64 (covers every
# current-gen board -- Pi 3/4/5 all default to 64-bit OS images now) and
# pushes it to GitHub Container Registry -- a documented alternative in
# DEPLOYMENT.md to `docker compose up -d --build`, useful mainly for a
# quick `docker run` test or on a board where building locally would be
# slow. No arm/v7 (32-bit): it's the only platform without prebuilt
# wheels for some of our compiled dependencies (asyncpg, cffi via
# cryptography), needing a source build under slow QEMU emulation with
# its own set of native headers to get right (missed libffi-dev entirely
# on the first attempt) -- not worth it for boards that are increasingly
# rare and can still just `docker compose up -d --build` locally like
# before multi-arch existed. The primary, documented deployment path
# stays `build: .` with the repo bind-mounted (see docker-compose.yml),
# since that's what the in-app self-update button (app/updater.py)
# assumes. Runs on every push to main (keeps the `latest` tag in step
# with what a plain `git pull` on main would give you) and on version
# tags (pins a specific release).

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history/tags, not the default shallow clone -- needed for
          # `git describe` below to find the right tag.
          fetch-depth: 0

      - name: Determine version
        id: version
        run: echo "value=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=,format=short,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
