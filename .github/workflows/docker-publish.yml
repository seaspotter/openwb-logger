name: Publish Docker image

# Builds the image from the Dockerfile for amd64, arm64, and arm/v7 (Pi
# Zero 2/3/4 32-bit, and other 32-bit ARM boards) and pushes it to GitHub
# Container Registry -- a documented alternative in DEPLOYMENT.md to
# `docker compose up -d --build`, useful mainly for a quick `docker run`
# test or on a board where building locally would be slow. The primary,
# documented deployment path stays `build: .` with the repo bind-mounted
# (see docker-compose.yml), since that's what the in-app self-update
# button (app/updater.py) assumes. Runs on every push to main (keeps the
# `latest` tag in step with what a plain `git pull` on main would give
# you) and on version tags (pins a specific release).

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history/tags, not the default shallow clone -- needed for
          # `git describe` below to find the right tag.
          fetch-depth: 0

      - name: Determine version
        id: version
        run: echo "value=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=,format=short,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
