# Opt-in override that enables the "Update" button in the UI (git pull +
# rebuild + recreate, triggered from POST /api/update -- see
# app/updater.py). Not merged into docker-compose.yml by default: it mounts
# the Docker socket into the app container, which is root-equivalent access
# to the host, so it's a deliberate choice rather than something every
# deployment gets automatically. See DEPLOYMENT.md's self-update section
# before enabling this, especially since the web UI has no authentication.
#
# Usage: set HOST_REPO_DIR in .env to this repo's *absolute path on the
# Docker host* (not inside any container), then:
#   docker compose -f docker-compose.yml -f docker-compose.selfupdate.yml up -d --build

services:
  app:
    environment:
      REPO_DIR: /repo
      HOST_REPO_DIR: ${HOST_REPO_DIR:?set HOST_REPO_DIR in .env to this repo's absolute host path}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo
