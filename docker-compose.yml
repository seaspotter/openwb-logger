services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: openwb_logger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openwb_logger}
      POSTGRES_DB: openwb_logger
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwb_logger"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://openwb_logger:${POSTGRES_PASSWORD:-openwb_logger}@timescaledb:5432/openwb_logger
      PORT: ${PORT:-8080}
      # Container defaults to UTC otherwise, which shows up as an
      # apparently-wrong "Letzter Abruf" time in the status bar (that
      # timestamp is generated by the app itself, unlike the log lines'
      # own `ts`, which come straight from openWB and are unaffected).
      # Override in .env (e.g. TZ=America/New_York) if this default isn't
      # your zone.
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      # Mounts the whole repo checkout onto WORKDIR (/app), so `git pull`
      # (run either on the host or via the in-app "Update" button, which
      # runs it inside the container against this same mount) updates the
      # running code immediately -- a restart then picks it up, no image
      # rebuild needed for pure code/template changes. See app/updater.py
      # and DEPLOYMENT.md. Comment this out for a fully immutable
      # deployment; self-update then just won't be offered in the UI.
      - .:/app

volumes:
  timescale_data:
