<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>openwb-logger</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #d8dbe2;
    --text: #1a1d24; --muted: #6b7280; --accent: #2563eb;
    --debug: #9aa0ab; --info: #1a1d24; --warning: #b45309; --error: #dc2626;
    --mark-bg: #bfdbfe; --mark-text: #0b1d3a;
    --backdrop: rgba(0, 0, 0, 0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --border: #2a2e38;
      --text: #d8dbe2; --muted: #8a8f9c; --accent: #4da3ff;
      --debug: #6b7280; --info: #d8dbe2; --warning: #e0a95c; --error: #e5675f;
      --mark-bg: #4da3ff; --mark-text: #06131f;
      --backdrop: rgba(0, 0, 0, 0.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e38;
    --text: #d8dbe2; --muted: #8a8f9c; --accent: #4da3ff;
    --debug: #6b7280; --info: #d8dbe2; --warning: #e0a95c; --error: #e5675f;
    --mark-bg: #4da3ff; --mark-text: #06131f;
    --backdrop: rgba(0, 0, 0, 0.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; }
  select, input[type=text], input[type=number], button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }
  input[type=text] { min-width: 200px; }
  input[type=number] { width: 80px; }
  input[type=datetime-local] { width: 180px; }
  .range-group { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.icon { width: 32px; padding: 6px; text-align: center; }
  label.check { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); }
  #right-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  main { padding: 10px 16px; }
  #pager { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
  #log {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    height: 70vh; overflow-y: auto; padding: 8px 0; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12.5px;
  }
  .line { padding: 1px 12px; white-space: pre-wrap; word-break: break-word; }
  .line.DEBUG { color: var(--debug); }
  .line.INFO { color: var(--info); }
  .line.WARNING { color: var(--warning); }
  .line.ERROR { color: var(--error); }
  .line mark { background: var(--mark-bg); color: var(--mark-text); border-radius: 2px; }
  #status { padding: 8px 16px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }
  #status span { margin-right: 16px; }

  #settings-backdrop {
    display: none; position: fixed; inset: 0; background: var(--backdrop);
    align-items: flex-start; justify-content: center; padding-top: 8vh; z-index: 10;
  }
  #settings-backdrop.open { display: flex; }
  #settings-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    width: min(480px, 92vw); padding: 18px 20px; max-height: 80vh; overflow-y: auto;
  }
  #settings-panel h2 { margin: 0 0 14px; font-size: 15px; }
  #settings-panel .field { margin-bottom: 14px; }
  #settings-panel label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  #settings-panel input[type=text], #settings-panel input[type=number] { width: 100%; }
  #settings-panel .sources { display: flex; flex-direction: column; gap: 6px; }
  #settings-panel .sources label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
  #settings-panel .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #settings-msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
  #settings-msg.error { color: var(--error); }
  #settings-msg.ok { color: var(--accent); }
  #update-info { display: flex; align-items: center; gap: 10px; }
  #update-commit { font-size: 12px; color: var(--muted); font-family: monospace; }
  #update-msg { font-size: 12px; margin-top: 6px; min-height: 16px; }
  #update-msg.error { color: var(--error); }
  #update-msg.ok { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>openwb-logger</h1>
  <select id="source"><option value="">Alle Quellen</option></select>
  <select id="day"></select>
  <span class="range-group" title="Zeitraum (überschreibt die Tagesauswahl)">
    Zeitraum <input id="range-from" type="datetime-local">
    bis <input id="range-to" type="datetime-local">
    <button id="range-clear" class="icon" title="Zeitraum zurücksetzen" disabled>&times;</button>
  </span>
  <select id="level"><option value="">Alle Level</option></select>
  <input id="search" type="text" placeholder="Suchen...">
  <label class="check"><input type="checkbox" id="live" checked> Live</label>
  <div id="right-controls">
    Zeile <input id="from" type="number" value="0" min="0">
    bis <input id="to" type="number" placeholder="Ende">
    <button id="export">Exportieren</button>
    <button id="sort-toggle" class="icon" title="Sortierung umkehren">&#8645;</button>
    <button id="fetch-now">Jetzt abrufen</button>
    <button id="theme-toggle" class="icon" title="Design wechseln">&#9680;</button>
    <button id="settings-open" class="icon" title="Einstellungen">&#9881;</button>
  </div>
</header>
<main>
  <div id="pager">
    <button id="prev">&larr; älter</button>
    <span id="range">-</span>
    <button id="next">neuer &rarr;</button>
  </div>
  <div id="log"></div>
</main>
<div id="status"></div>

<div id="settings-backdrop">
  <div id="settings-panel">
    <h2>Einstellungen</h2>
    <div class="field">
      <label for="s-base-url">openWB-Adresse (Basis-URL)</label>
      <input id="s-base-url" type="text" placeholder="http://10.1.5.32">
    </div>
    <div class="field">
      <label for="s-ramdisk">Ramdisk-Pfad</label>
      <input id="s-ramdisk" type="text" placeholder="/openWB/ramdisk">
    </div>
    <div class="field">
      <label>Zu erfassende Logs</label>
      <div class="sources" id="s-sources"></div>
    </div>
    <div class="field">
      <label for="s-interval">Abrufintervall (Sekunden)</label>
      <input id="s-interval" type="number" min="60" step="60">
    </div>
    <div class="field">
      <label for="s-retention">Aufbewahrung (Tage)</label>
      <input id="s-retention" type="number" min="1">
    </div>
    <div class="field">
      <label>Version</label>
      <div id="update-info">
        <span id="update-commit">-</span>
        <button id="update-btn" type="button">Update</button>
      </div>
      <div id="update-msg"></div>
    </div>
    <div id="settings-msg"></div>
    <div class="actions">
      <button id="settings-cancel">Abbrechen</button>
      <button id="settings-save">Speichern</button>
    </div>
  </div>
</div>

<script>
const sourceEl = document.getElementById('source');
const dayEl = document.getElementById('day');
const levelEl = document.getElementById('level');
const searchEl = document.getElementById('search');
const liveEl = document.getElementById('live');
const logEl = document.getElementById('log');
const rangeEl = document.getElementById('range');
const statusEl = document.getElementById('status');
const rangeFromEl = document.getElementById('range-from');
const rangeToEl = document.getElementById('range-to');
const rangeClearBtn = document.getElementById('range-clear');
const LIMIT = 1000;
let offset = 0;
let liveTimer = null;

// ---- Zeitraum (überschreibt die Tagesauswahl, solange gesetzt) ----
function hasCustomRange() {
  return !!(rangeFromEl.value || rangeToEl.value);
}
function updateRangeUI() {
  const active = hasCustomRange();
  dayEl.disabled = active;
  liveEl.disabled = active;
  rangeClearBtn.disabled = !active;
}
rangeFromEl.onchange = rangeToEl.onchange = () => { offset = 0; updateRangeUI(); load(); };
rangeClearBtn.onclick = () => {
  rangeFromEl.value = '';
  rangeToEl.value = '';
  offset = 0;
  updateRangeUI();
  load();
};

// ---- Sortierung (älteste/neueste zuerst) ----
const SORT_KEY = 'openwb-logger-sort-desc';
let sortDesc = localStorage.getItem(SORT_KEY) === 'true';
const sortToggleBtn = document.getElementById('sort-toggle');
function applySortTitle() {
  sortToggleBtn.title = sortDesc ? 'Neueste zuerst (Klick: älteste zuerst)' : 'Älteste zuerst (Klick: neueste zuerst)';
}
applySortTitle();
sortToggleBtn.onclick = () => {
  sortDesc = !sortDesc;
  localStorage.setItem(SORT_KEY, sortDesc);
  applySortTitle();
  render(lastLines, lastTotal, lastOffset);
};
let lastLines = [], lastTotal = 0, lastOffset = 0;

// ---- Design (hell/dunkel) ----
const THEME_KEY = 'openwb-logger-theme';
function applyTheme(mode) {
  if (mode === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', mode);
}
function cycleTheme() {
  const current = localStorage.getItem(THEME_KEY) || 'system';
  const next = { system: 'light', light: 'dark', dark: 'system' }[current];
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}
applyTheme(localStorage.getItem(THEME_KEY) || 'system');
document.getElementById('theme-toggle').onclick = cycleTheme;

// ---- Log-Ansicht ----
function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function highlight(raw, term) {
  const esc = escapeHtml(raw);
  if (!term) return esc;
  const re = new RegExp(escapeHtml(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig');
  return esc.replace(re, m => `<mark>${m}</mark>`);
}

function params(extra) {
  const p = new URLSearchParams();
  if (sourceEl.value) p.set('source', sourceEl.value);
  if (hasCustomRange()) {
    if (rangeFromEl.value) p.set('from', rangeFromEl.value);
    if (rangeToEl.value) p.set('to', rangeToEl.value);
  } else if (dayEl.value && dayEl.value !== '__today__') {
    p.set('day', dayEl.value);
  }
  if (levelEl.value) p.set('level', levelEl.value);
  if (searchEl.value) p.set('search', searchEl.value);
  for (const k in extra) p.set(k, extra[k]);
  return p;
}

async function loadSources() {
  const res = await fetch('/api/sources');
  const data = await res.json();
  const previous = sourceEl.value;
  sourceEl.innerHTML = '<option value="">Alle Quellen</option>';
  const byName = Object.fromEntries(data.catalog.map(c => [c.name, c]));
  for (const name of data.enabled) {
    const meta = byName[name];
    sourceEl.add(new Option(meta ? meta.label : name, name));
  }
  if ([...sourceEl.options].some(o => o.value === previous)) sourceEl.value = previous;
}

async function loadDates() {
  const p = sourceEl.value ? '?source=' + encodeURIComponent(sourceEl.value) : '';
  const res = await fetch('/api/dates' + p);
  const data = await res.json();
  const previous = dayEl.value;
  dayEl.innerHTML = '';
  dayEl.add(new Option('Heute (live)', '__today__'));
  for (const d of data.dates) dayEl.add(new Option(d, d));
  dayEl.value = [...dayEl.options].some(o => o.value === previous) ? previous : '__today__';
}

async function loadLevels() {
  const p = sourceEl.value ? '?source=' + encodeURIComponent(sourceEl.value) : '';
  const res = await fetch('/api/levels' + p);
  const data = await res.json();
  const previous = levelEl.value;
  levelEl.innerHTML = '<option value="">Alle Level</option>';
  for (const l of data.levels) levelEl.add(new Option(l, l));
  if ([...levelEl.options].some(o => o.value === previous)) levelEl.value = previous;
}

function render(lines, total, off) {
  lastLines = lines; lastTotal = total; lastOffset = off;
  const term = searchEl.value;
  const ordered = sortDesc ? [...lines].reverse() : lines;
  logEl.innerHTML = ordered.map(l =>
    `<div class="line ${l.level || ''}">${highlight(l.raw, term)}</div>`
  ).join('');
  rangeEl.textContent = total === 0 ? 'keine Zeilen' : `${off + 1}-${off + lines.length} von ${total}`;
}

async function load() {
  const customRange = hasCustomRange();
  const isToday = !customRange && dayEl.value === '__today__';
  const today = new Date().toISOString().slice(0, 10);
  const liveTail = isToday && liveEl.checked;
  const extra = liveTail
    ? { day: today, tail: 'true', limit: LIMIT }
    : customRange
      ? { offset, limit: LIMIT }
      : { day: isToday ? today : dayEl.value, offset, limit: LIMIT };
  const p = params(extra);
  const res = await fetch('/api/logs?' + p.toString());
  const data = await res.json();
  offset = data.offset;
  render(data.lines, data.total, data.offset);
  if (liveTail) logEl.scrollTop = sortDesc ? 0 : logEl.scrollHeight;
}

async function loadStatus() {
  const res = await fetch('/api/status');
  const s = await res.json();
  let extra = '';
  const gapEntries = Object.entries(s.sources).filter(([, v]) => v.total_gaps_detected);
  if (gapEntries.length) {
    extra = '<span>Lücken: ' + gapEntries.map(([n, v]) => `${n} ${v.total_gaps_detected} (${v.total_gaps_recovered} wiederhergestellt)`).join(', ') + '</span>';
  }
  statusEl.innerHTML =
    `<span>Quelle: ${s.source_url}</span>` +
    `<span>Abruf: alle ${s.fetch_interval_seconds}s</span>` +
    `<span>Aufbewahrung: ${s.retention_days}d</span>` +
    `<span>Zeilen: ${s.total_rows}</span>` +
    `<span>Letzter Abruf: ${s.last_fetch_at || '-'}</span>` +
    (s.last_error ? `<span style="color:var(--error)">Fehler: ${s.last_error}</span>` : '') +
    extra;
}

function restartLiveTimer() {
  if (liveTimer) clearInterval(liveTimer);
  liveTimer = setInterval(() => {
    if (!hasCustomRange() && dayEl.value === '__today__' && liveEl.checked) load();
  }, 5000);
}

liveEl.onchange = () => { if (!hasCustomRange() && dayEl.value === '__today__') load(); };

document.getElementById('prev').onclick = () => {
  liveEl.checked = false;
  offset = Math.max(0, offset - LIMIT);
  load();
};
document.getElementById('next').onclick = () => {
  liveEl.checked = false;
  offset = offset + LIMIT;
  load();
};
sourceEl.onchange = async () => { offset = 0; await loadDates(); await loadLevels(); load(); };
dayEl.onchange = () => { offset = 0; load(); };
levelEl.onchange = () => { offset = 0; load(); };
let searchDebounce;
searchEl.oninput = () => { clearTimeout(searchDebounce); searchDebounce = setTimeout(() => { offset = 0; load(); }, 300); };

document.getElementById('export').onclick = () => {
  const lineFrom = document.getElementById('from').value || 0;
  const lineTo = document.getElementById('to').value;
  const p = params({ start: lineFrom });
  if (!hasCustomRange()) {
    const isToday = dayEl.value === '__today__';
    p.set('day', isToday ? new Date().toISOString().slice(0, 10) : dayEl.value);
  }
  if (lineTo) p.set('end', lineTo);
  window.open('/api/logs/export?' + p.toString(), '_blank');
};

const fetchNowBtn = document.getElementById('fetch-now');
fetchNowBtn.onclick = async () => {
  fetchNowBtn.disabled = true;
  const originalText = fetchNowBtn.textContent;
  fetchNowBtn.textContent = 'Wird abgerufen...';
  try {
    await fetch('/api/fetch-now', { method: 'POST' });
    await load();
    await loadStatus();
  } finally {
    fetchNowBtn.disabled = false;
    fetchNowBtn.textContent = originalText;
  }
};

// ---- Einstellungen ----
const backdrop = document.getElementById('settings-backdrop');
const msgEl = document.getElementById('settings-msg');

async function openSettings() {
  msgEl.textContent = '';
  msgEl.className = '';
  const res = await fetch('/api/settings');
  const data = await res.json();
  document.getElementById('s-base-url').value = data.settings.openwb_base_url;
  document.getElementById('s-ramdisk').value = data.settings.openwb_ramdisk_path;
  document.getElementById('s-interval').value = data.settings.fetch_interval_seconds;
  document.getElementById('s-retention').value = data.settings.retention_days;

  const box = document.getElementById('s-sources');
  box.innerHTML = '';
  for (const src of data.catalog) {
    const id = 'src-' + src.name;
    const wrap = document.createElement('label');
    const checked = data.settings.enabled_sources.includes(src.name) ? 'checked' : '';
    wrap.innerHTML = `<input type="checkbox" id="${id}" value="${src.name}" ${checked}> ${src.label} <span style="color:var(--muted)">(${src.format})</span>`;
    box.appendChild(wrap);
  }
  await loadUpdateInfo();
  backdrop.classList.add('open');
}

function closeSettings() { backdrop.classList.remove('open'); }

document.getElementById('settings-open').onclick = openSettings;
document.getElementById('settings-cancel').onclick = closeSettings;
backdrop.onclick = (e) => { if (e.target === backdrop) closeSettings(); };

document.getElementById('settings-save').onclick = async () => {
  const enabled = [...document.querySelectorAll('#s-sources input:checked')].map(el => el.value);
  const patch = {
    openwb_base_url: document.getElementById('s-base-url').value,
    openwb_ramdisk_path: document.getElementById('s-ramdisk').value,
    enabled_sources: enabled,
    fetch_interval_seconds: parseInt(document.getElementById('s-interval').value, 10),
    retention_days: parseInt(document.getElementById('s-retention').value, 10),
  };
  const res = await fetch('/api/settings', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(patch),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    msgEl.textContent = err.detail || 'Einstellungen konnten nicht gespeichert werden';
    msgEl.className = 'error';
    return;
  }
  msgEl.textContent = 'Gespeichert. Wird beim nächsten Abruf wirksam.';
  msgEl.className = 'ok';
  await loadSources();
  await loadDates();
  await loadLevels();
  await loadStatus();
  setTimeout(closeSettings, 900);
};

// ---- Update ----
const updateBtn = document.getElementById('update-btn');
const updateCommitEl = document.getElementById('update-commit');
const updateMsgEl = document.getElementById('update-msg');

async function loadUpdateInfo() {
  updateMsgEl.textContent = '';
  updateMsgEl.className = '';
  const res = await fetch('/api/update/status');
  const data = await res.json();
  updateCommitEl.textContent = data.current_commit ? data.current_commit : '-';
  updateBtn.disabled = !data.available;
  updateBtn.title = data.available ? '' : 'Self-Update ist nicht konfiguriert (HOST_REPO_DIR fehlt)';
  if (data.last_update) {
    updateMsgEl.textContent = data.last_update.detail;
    updateMsgEl.className = data.last_update.ok ? 'ok' : 'error';
  }
}

updateBtn.onclick = async () => {
  if (!confirm('Update jetzt starten? Die Anwendung wird dabei neu gebaut und neu gestartet.')) return;
  updateBtn.disabled = true;
  const originalText = updateBtn.textContent;
  updateBtn.textContent = 'Wird gestartet...';
  try {
    const res = await fetch('/api/update', { method: 'POST' });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      updateMsgEl.textContent = err.detail || 'Update konnte nicht gestartet werden';
      updateMsgEl.className = 'error';
      updateBtn.disabled = false;
      updateBtn.textContent = originalText;
      return;
    }
    updateMsgEl.textContent = 'Update gestartet. Die Anwendung startet in Kürze neu — diese Seite dann manuell neu laden.';
    updateMsgEl.className = 'ok';
  } finally {
    updateBtn.textContent = originalText;
  }
};

(async function init() {
  await loadSources();
  await loadDates();
  await loadLevels();
  await load();
  await loadStatus();
  restartLiveTimer();
  setInterval(loadStatus, 5000);
})();
</script>
</body>
</html>
