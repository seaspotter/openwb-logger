<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>openWB Logger</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2316a34a'/%3E%3Cline x1='6' y1='8' x2='18' y2='8' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3Cline x1='6' y1='12' x2='15' y2='12' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3Cline x1='6' y1='16' x2='17' y2='16' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #d8dbe2;
    --text: #1a1d24; --muted: #6b7280; --accent: #2563eb;
    --debug: #1e7a42; --info: #1a1d24; --warning: #b45309; --error: #dc2626;
    --mark-bg: #bfdbfe; --mark-text: #0b1d3a;
    --backdrop: rgba(0, 0, 0, 0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --border: #2a2e38;
      --text: #d8dbe2; --muted: #8a8f9c; --accent: #4da3ff;
      --debug: #5fbd82; --info: #d8dbe2; --warning: #e0a95c; --error: #e5675f;
      --mark-bg: #4da3ff; --mark-text: #06131f;
      --backdrop: rgba(0, 0, 0, 0.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e38;
    --text: #d8dbe2; --muted: #8a8f9c; --accent: #4da3ff;
    --debug: #5fbd82; --info: #d8dbe2; --warning: #e0a95c; --error: #e5675f;
    --mark-bg: #4da3ff; --mark-text: #06131f;
    --backdrop: rgba(0, 0, 0, 0.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 8px; margin-right: 8px; }
  .brand-icon { display: flex; flex-shrink: 0; }
  header h1 { font-size: 17px; margin: 0 12px 0 0; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  /* Fixed green, not var(--accent) (blue, used for interactive elements
     throughout) -- this is the brand mark, matching the logo's own color,
     not a UI accent. */
  .brand-mark { font-weight: 700; color: #16a34a; }
  select, input[type=text], input[type=number], button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }
  input[type=text] { min-width: 200px; }
  input[type=number] { width: 80px; }
  input[type=datetime-local] { width: 180px; }
  .range-group { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .range-quick { padding: 4px 7px; font-size: 12px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.icon { width: 32px; padding: 6px; display: inline-flex; align-items: center; justify-content: center; }
  #alerts-btn { position: relative; color: var(--muted); }
  #alerts-btn.has-alerts { color: var(--error); border-color: var(--error); }
  #alerts-btn.has-alerts::after {
    content: attr(data-count); position: absolute; top: -5px; right: -5px;
    background: var(--error); color: #fff; font-size: 9px; line-height: 1.4;
    min-width: 14px; height: 14px; border-radius: 7px; text-align: center;
  }
  .alerts-list { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .alerts-list li { font-size: 13px; padding: 6px 8px; border-radius: 6px; background: var(--bg); }
  .alerts-list li.error { color: var(--error); }
  .alerts-list li.warning { color: var(--warning); }
  label.check { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); }
  #right-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  main { padding: 10px 16px; }
  #pager { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
  #log {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    /* Fills the space left over after header/pager/status, rather than a
       fixed viewport percentage that leaves a growing gap on tall windows. */
    height: calc(100vh - 170px); overflow-y: auto; padding: 8px 0;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12.5px;
  }
  .line { padding: 1px 12px; white-space: pre-wrap; word-break: break-word; }
  .line.DEBUG { color: var(--debug); }
  .line.INFO { color: var(--info); }
  .line.WARNING { color: var(--warning); }
  .line.ERROR { color: var(--error); }
  .line mark { background: var(--mark-bg); color: var(--mark-text); border-radius: 2px; }
  #status { padding: 8px 16px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }
  #status span { margin-right: 16px; }

  #settings-backdrop {
    display: none; position: fixed; inset: 0; background: var(--backdrop);
    align-items: flex-start; justify-content: center; padding-top: 8vh; z-index: 10;
  }
  #settings-backdrop.open { display: flex; }
  #settings-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    width: min(480px, 92vw); padding: 18px 20px; max-height: 80vh; overflow-y: auto;
  }
  #settings-panel h2 { margin: 0 0 14px; font-size: 15px; }
  #settings-panel .field { margin-bottom: 14px; }
  #settings-panel label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  #settings-panel input[type=text], #settings-panel input[type=number] { width: 100%; }
  #settings-panel .sources { display: flex; flex-direction: column; gap: 6px; }
  #settings-panel .sources label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
  #settings-panel .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #settings-msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
  #settings-msg.error { color: var(--error); }
  #settings-msg.ok { color: var(--accent); }
  #update-info { display: flex; align-items: center; gap: 10px; }
  #update-commit { font-size: 12px; color: var(--muted); font-family: monospace; }
  #update-msg { font-size: 12px; margin-top: 6px; min-height: 16px; }
  #update-msg.error { color: var(--error); }
  #update-msg.ok { color: var(--accent); }
  #retention-info { display: flex; align-items: center; gap: 10px; }
  #retention-status { font-size: 12px; color: var(--muted); }
  #retention-status.unhealthy { color: var(--error); }
  #retention-msg { font-size: 12px; margin-top: 6px; min-height: 16px; }
  #retention-msg.error { color: var(--error); }
  #retention-msg.ok { color: var(--accent); }

  .modal-overlay {
    display: flex; position: fixed; inset: 0; background: var(--backdrop);
    align-items: flex-start; justify-content: center; padding-top: 8vh; z-index: 20;
  }
  .modal-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    width: min(380px, 92vw); padding: 18px 20px;
  }
  .modal-card p { margin: 0 0 14px; font-size: 14px; color: var(--text); }
  .modal-card input[type=text] { width: 100%; margin-bottom: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .toast-container {
    position: fixed; bottom: 18px; right: 18px; z-index: 30;
    display: flex; flex-direction: column; gap: 8px; max-width: 340px;
  }
  .toast {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 13px; color: var(--text); cursor: pointer;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
  }
  .toast.error { border-color: var(--error); color: var(--error); }
  .toast.ok { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24">
        <rect width="24" height="24" rx="6" fill="#16a34a"/>
        <line x1="6" y1="8" x2="18" y2="8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="6" y1="12" x2="15" y2="12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="6" y1="16" x2="17" y2="16" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </span>
    <h1><span class="brand-mark">openWB</span> Logger</h1>
  </div>
  <select id="source"></select>
  <select id="day"></select>
  <span class="range-group" title="Zeitraum (überschreibt die Tagesauswahl)">
    Zeitraum <input id="range-from" type="datetime-local">
    bis <input id="range-to" type="datetime-local">
    <button id="range-clear" class="icon" title="Zeitraum zurücksetzen" disabled>&times;</button>
    <button type="button" class="range-quick" data-minutes="15">15 Min</button>
    <button type="button" class="range-quick" data-minutes="30">30 Min</button>
    <button type="button" class="range-quick" data-minutes="60">1 Std</button>
    <button type="button" class="range-quick" data-minutes="120">2 Std</button>
  </span>
  <select id="level"><option value="">Alle Level</option></select>
  <input id="search" type="text" placeholder="Suchen...">
  <label class="check"><input type="checkbox" id="live" checked> Live</label>
  <div id="right-controls">
    <button id="export">Exportieren</button>
    <button id="paste-export">An Paste senden</button>
    <button id="sort-toggle" class="icon" title="Sortierung umkehren">&#8645;</button>
    <button id="fetch-now">Jetzt abrufen</button>
    <button id="alerts-btn" class="icon" title="Keine aktuellen Fehler oder Warnungen">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 2 20h20L12 3z"/>
        <line x1="12" y1="10" x2="12" y2="14"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </button>
    <button id="theme-toggle" class="icon" title="Design wechseln"></button>
    <button id="settings-open" class="icon" title="Einstellungen">&#9881;</button>
  </div>
</header>
<main>
  <div id="pager">
    <button id="prev">&larr; älter</button>
    <span id="range">-</span>
    <button id="next">neuer &rarr;</button>
  </div>
  <div id="log"></div>
</main>
<div id="status"></div>

<div id="settings-backdrop">
  <div id="settings-panel">
    <h2>Einstellungen</h2>
    <div class="field">
      <label for="s-base-url">openWB-Adresse (Basis-URL)</label>
      <input id="s-base-url" type="text" placeholder="http://10.1.5.32">
    </div>
    <div class="field">
      <label for="s-ramdisk">Ramdisk-Pfad</label>
      <input id="s-ramdisk" type="text" placeholder="/openWB/ramdisk">
    </div>
    <div class="field">
      <label>Zu erfassende Logs</label>
      <div class="sources" id="s-sources"></div>
    </div>
    <div class="field">
      <label for="s-interval">Abrufintervall (Sekunden)</label>
      <input id="s-interval" type="number" min="60" step="60">
    </div>
    <div class="field">
      <label for="s-retention">Aufbewahrung (Tage)</label>
      <input id="s-retention" type="number" min="1">
    </div>
    <div class="field">
      <label for="s-page-size">Zeilen pro Seite</label>
      <input id="s-page-size" type="number" min="100" max="20000" step="100">
    </div>
    <div class="field">
      <label class="check"><input type="checkbox" id="s-export-gzip"> Exportierte Datei komprimieren (.gz)</label>
    </div>
    <div class="field">
      <label class="check"><input type="checkbox" id="s-paste-custom"> Eigene Paste-Instanz verwenden</label>
      <div id="s-paste-custom-fields" style="display:none; margin-top:8px;">
        <label for="s-paste-upload">Paste-Upload-URL</label>
        <input id="s-paste-upload" type="text" placeholder="https://bytebin.openwb.de/post">
        <label for="s-paste-view" style="margin-top:8px;">Paste-Anzeige-URL</label>
        <input id="s-paste-view" type="text" placeholder="https://paste.openwb.de/">
      </div>
    </div>
    <div class="field">
      <label>Retention-Job</label>
      <div id="retention-info">
        <span id="retention-status">-</span>
        <button id="retention-repair-btn" type="button" style="display:none;">Reparieren</button>
      </div>
      <div id="retention-msg"></div>
    </div>
    <div class="field">
      <label>Version</label>
      <div id="update-info">
        <span id="update-commit">-</span>
        <button id="update-check" type="button">Prüfen</button>
        <button id="update-btn" type="button">Update</button>
      </div>
      <div id="update-msg"></div>
    </div>
    <div id="settings-msg"></div>
    <div class="actions">
      <button id="settings-cancel">Abbrechen</button>
      <button id="settings-save">Speichern</button>
    </div>
  </div>
</div>

<script>
// ---- Toasts & confirm/link modal (replaces native alert()/confirm()/prompt(),
// which open as separate browser-chrome popups instead of staying in-app --
// same pattern used in knxpilot) ----
function getToastContainer() {
  let el = document.querySelector('.toast-container');
  if (!el) {
    el = document.createElement('div');
    el.className = 'toast-container';
    document.body.appendChild(el);
  }
  return el;
}

function showToast(message, type = 'info', { sticky = false } = {}) {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  toast.onclick = () => toast.remove();
  getToastContainer().appendChild(toast);
  if (!sticky) setTimeout(() => toast.remove(), 4000);
  return toast;
}

// onClose fires whenever the modal closes for ANY reason (Escape, backdrop
// click, or the caller's own close()) -- callers that need to settle a
// promise on every close path, not just their own buttons, should use it,
// guarding against double-settling since it also fires after close().
function openModal(bodyHtml, { onClose } = {}) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-card">${bodyHtml}</div>`;
  document.body.appendChild(overlay);
  const close = () => {
    document.removeEventListener('keydown', onKeydown);
    overlay.remove();
    if (onClose) onClose();
  };
  const onKeydown = (ev) => { if (ev.key === 'Escape') close(); };
  overlay.addEventListener('click', (ev) => { if (ev.target === overlay) close(); });
  document.addEventListener('keydown', onKeydown);
  return { overlay, close };
}

function showConfirm(message) {
  return new Promise((resolve) => {
    let settled = false;
    const modal = openModal(`
      <p></p>
      <div class="modal-actions">
        <button data-action="cancel">Abbrechen</button>
        <button data-action="confirm">OK</button>
      </div>`, {
      onClose: () => { if (!settled) { settled = true; resolve(false); } },
    });
    modal.overlay.querySelector('p').textContent = message;
    modal.overlay.addEventListener('click', (ev) => {
      const action = ev.target.dataset && ev.target.dataset.action;
      if (action === 'confirm') { settled = true; resolve(true); modal.close(); }
      else if (action === 'cancel') modal.close();
    });
  });
}

function showLink(message, url) {
  const modal = openModal(`
    <p></p>
    <input type="text" readonly>
    <div class="modal-actions">
      <button data-action="close">Schließen</button>
    </div>`);
  modal.overlay.querySelector('p').textContent = message;
  const input = modal.overlay.querySelector('input');
  input.value = url;
  input.onclick = () => input.select();
  modal.overlay.addEventListener('click', (ev) => {
    if (ev.target.dataset && ev.target.dataset.action === 'close') modal.close();
  });
}

// Must match DEFAULT_PASTE_UPLOAD_URL/DEFAULT_PASTE_VIEW_URL in
// app/runtime_settings.py -- used only to decide whether the settings
// panel's "Eigene Paste-Instanz verwenden" checkbox should start
// checked/unchecked, not as the actual fallback (the backend owns that).
const PASTE_DEFAULT_UPLOAD_URL = 'https://bytebin.openwb.de/post';
const PASTE_DEFAULT_VIEW_URL = 'https://paste.openwb.de/';

document.getElementById('s-paste-custom').onchange = (e) => {
  document.getElementById('s-paste-custom-fields').style.display = e.target.checked ? 'block' : 'none';
};

const sourceEl = document.getElementById('source');
const dayEl = document.getElementById('day');
const levelEl = document.getElementById('level');
const searchEl = document.getElementById('search');
const liveEl = document.getElementById('live');
const logEl = document.getElementById('log');
const rangeEl = document.getElementById('range');
const statusEl = document.getElementById('status');
const rangeFromEl = document.getElementById('range-from');
const rangeToEl = document.getElementById('range-to');
const rangeClearBtn = document.getElementById('range-clear');
let LIMIT = 1000; // overwritten by the page_size setting once loaded, see init()/openSettings()
// Zeitraum mode fetches the whole selected window in one request instead of
// paging -- the user already bounded it by picking from/to, so 1000-at-a-
// time would just defeat the point (see CHANGELOG). Capped, not unbounded,
// so an accidentally huge window (e.g. picking days instead of hours by
// mistake) can't hang the browser rendering hundreds of thousands of DOM
// nodes -- see the truncation notice in load() when this is exceeded.
const RANGE_LIMIT = 100000;
// Keyset (cursor) pagination by (ts, id) instead of a numeric offset -- see
// CHANGELOG. `pendingCursor` describes the next /api/logs request: null
// means "start from the beginning"; {after} / {before} continue from the
// boundary of whatever's currently on screen (updated by render() on every
// load, from firstShown/lastShown).
let pendingCursor = null;
let firstShown = null, lastShown = null;
let liveTimer = null;

// ---- Zeitraum (überschreibt die Tagesauswahl, solange gesetzt) ----
function hasCustomRange() {
  return !!(rangeFromEl.value || rangeToEl.value);
}
function updateRangeUI() {
  const active = hasCustomRange();
  dayEl.disabled = active;
  liveEl.disabled = active;
  if (active) liveEl.checked = false;
  rangeClearBtn.disabled = !active;
  document.getElementById('prev').disabled = active;
  document.getElementById('next').disabled = active;
}
rangeFromEl.onchange = rangeToEl.onchange = () => { pendingCursor = null; updateRangeUI(); load(); };
rangeClearBtn.onclick = () => {
  rangeFromEl.value = '';
  rangeToEl.value = '';
  pendingCursor = null;
  updateRangeUI();
  load();
};

// Local wall-clock formatting (no timezone conversion, matching how the
// rest of the app treats timestamps -- see CLAUDE.md), in the format
// <input type="datetime-local"> expects.
function formatLocalDateTime(date) {
  const pad = n => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}` +
    `T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}
document.querySelectorAll('.range-quick').forEach(btn => {
  btn.onclick = () => {
    const minutes = parseInt(btn.dataset.minutes, 10);
    const now = new Date();
    rangeToEl.value = formatLocalDateTime(now);
    rangeFromEl.value = formatLocalDateTime(new Date(now.getTime() - minutes * 60000));
    pendingCursor = null;
    updateRangeUI();
    load();
  };
});

// ---- Sortierung (älteste/neueste zuerst) ----
const SORT_KEY = 'openwb-logger-sort-desc';
let sortDesc = localStorage.getItem(SORT_KEY) === 'true';
const sortToggleBtn = document.getElementById('sort-toggle');
function applySortTitle() {
  sortToggleBtn.title = sortDesc ? 'Neueste zuerst (Klick: älteste zuerst)' : 'Älteste zuerst (Klick: neueste zuerst)';
}
applySortTitle();
sortToggleBtn.onclick = () => {
  sortDesc = !sortDesc;
  localStorage.setItem(SORT_KEY, sortDesc);
  applySortTitle();
  render(lastLines);
};

// ---- Export-Kompression (.gz) ----
// A personal browsing preference (like sort order/theme above), not a
// server-side setting -- purely affects what the "Exportieren" button
// requests, so localStorage fits better than a runtime_settings round
// trip to the server. Paste upload already gzips the HTTP transfer itself
// regardless of this (see api_export_paste in web.py) -- unrelated,
// unaffected by this checkbox.
const EXPORT_GZIP_KEY = 'openwb-logger-export-gzip';
const exportGzipEl = document.getElementById('s-export-gzip');
exportGzipEl.checked = localStorage.getItem(EXPORT_GZIP_KEY) === 'true';
exportGzipEl.onchange = () => localStorage.setItem(EXPORT_GZIP_KEY, exportGzipEl.checked);
let lastLines = [];

// ---- Design (hell/dunkel) ----
// A plain light/dark toggle, not a system/light/dark cycle: the previous
// 3-way cycle meant the first click (system -> light) was often a visual
// no-op whenever the OS was already in light mode, making the button look
// broken ("only works on the second click").
const THEME_KEY = 'openwb-logger-theme';
// Icon shows the theme currently active (sun = light, moon = dark), not
// the one a click switches to.
const SUN_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/>' +
  '<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">' +
  '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>';
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-toggle').innerHTML = theme === 'dark' ? MOON_ICON : SUN_ICON;
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}
applyTheme(localStorage.getItem(THEME_KEY) ||
  (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
document.getElementById('theme-toggle').onclick = toggleTheme;

// ---- Log-Ansicht ----
function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function highlight(raw, term) {
  const esc = escapeHtml(raw);
  if (!term) return esc;
  const re = new RegExp(escapeHtml(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig');
  return esc.replace(re, m => `<mark>${m}</mark>`);
}

function params(extra) {
  const p = new URLSearchParams();
  if (sourceEl.value) p.set('source', sourceEl.value);
  if (hasCustomRange()) {
    if (rangeFromEl.value) p.set('from', rangeFromEl.value);
    if (rangeToEl.value) p.set('to', rangeToEl.value);
  } else if (dayEl.value && dayEl.value !== '__today__') {
    p.set('day', dayEl.value);
  }
  if (levelEl.value) p.set('level', levelEl.value);
  if (searchEl.value) p.set('search', searchEl.value);
  for (const k in extra) p.set(k, extra[k]);
  return p;
}

async function loadSources() {
  // Always exactly one source, never "all combined" -- interleaving
  // multiple sources' lines together was more confusing than useful, and
  // fetching more than one source is already an explicit opt-in per
  // source in the settings panel, not something the log view should
  // default to blending.
  const res = await fetch('/api/sources');
  const data = await res.json();
  const previous = sourceEl.value;
  sourceEl.innerHTML = '';
  const byName = Object.fromEntries(data.catalog.map(c => [c.name, c]));
  for (const name of data.enabled) {
    const meta = byName[name];
    sourceEl.add(new Option(meta ? meta.label : name, name));
  }
  if ([...sourceEl.options].some(o => o.value === previous)) {
    sourceEl.value = previous;
  } else if (data.enabled.includes('main')) {
    sourceEl.value = 'main';
  } else if (sourceEl.options.length) {
    sourceEl.selectedIndex = 0;
  }
}

async function loadDates() {
  const p = sourceEl.value ? '?source=' + encodeURIComponent(sourceEl.value) : '';
  const res = await fetch('/api/dates' + p);
  const data = await res.json();
  const previous = dayEl.value;
  dayEl.innerHTML = '';
  dayEl.add(new Option('Heute (live)', '__today__'));
  for (const d of data.dates) dayEl.add(new Option(d, d));
  dayEl.value = [...dayEl.options].some(o => o.value === previous) ? previous : '__today__';
}

async function loadLevels() {
  const p = sourceEl.value ? '?source=' + encodeURIComponent(sourceEl.value) : '';
  const res = await fetch('/api/levels' + p);
  const data = await res.json();
  const previous = levelEl.value;
  levelEl.innerHTML = '<option value="">Alle Level</option>';
  for (const l of data.levels) levelEl.add(new Option(l, l));
  if ([...levelEl.options].some(o => o.value === previous)) levelEl.value = previous;
}

function render(lines) {
  lastLines = lines;
  if (lines.length) {
    firstShown = { ts: lines[0].ts, id: lines[0].id };
    lastShown = { ts: lines[lines.length - 1].ts, id: lines[lines.length - 1].id };
  } else {
    firstShown = null;
    lastShown = null;
  }
  const term = searchEl.value;
  const ordered = sortDesc ? [...lines].reverse() : lines;
  logEl.innerHTML = ordered.map(l =>
    `<div class="line ${l.level || ''}">${highlight(l.raw, term)}</div>`
  ).join('');
  rangeEl.textContent = lines.length === 0 ? 'keine Zeilen' : `${lines.length} Zeilen`;
}

async function load() {
  const customRange = hasCustomRange();
  const isToday = !customRange && dayEl.value === '__today__';
  const today = new Date().toISOString().slice(0, 10);
  const liveFollowing = isToday && liveEl.checked;
  // Show the most recent lines whenever there's no explicit paging cursor
  // and we're on "today" -- covers actual live-follow *and* the moment
  // Live just turned off (level/source/search change, scrolling away, ...)
  // with nothing paged yet. Without this, changing e.g. the level filter
  // while live-tailing fell through to the plain day-view branch below
  // with no cursor, which defaults to ascending-from-midnight -- silently
  // dumping you at the start of the day instead of staying near "now".
  const showTail = isToday && !pendingCursor;

  const extra = { limit: customRange ? RANGE_LIMIT : LIMIT };
  if (showTail) {
    extra.day = today;
    extra.tail = 'true';
  } else if (customRange) {
    // Always a fresh, unbounded-by-cursor fetch -- Zeitraum has no paging
    // of its own (see RANGE_LIMIT above), regardless of whatever cursor a
    // previous day/range view happened to leave in `pendingCursor`.
  } else {
    extra.day = isToday ? today : dayEl.value;
    if (pendingCursor?.after) {
      extra.after_ts = pendingCursor.after.ts;
      extra.after_id = pendingCursor.after.id;
    } else if (pendingCursor?.before) {
      extra.before_ts = pendingCursor.before.ts;
      extra.before_id = pendingCursor.before.id;
    }
  }
  const p = params(extra);
  const res = await fetch('/api/logs?' + p.toString());
  const data = await res.json();
  render(data.lines);

  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  if (customRange) {
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    if (data.has_more_after) {
      rangeEl.textContent += ` — auf die ersten ${RANGE_LIMIT} begrenzt, Zeitraum eingrenzen für den Rest`;
    }
  } else if (showTail) {
    prevBtn.disabled = !data.has_more_before;
    nextBtn.disabled = true;
  } else {
    prevBtn.disabled = !data.has_more_before;
    nextBtn.disabled = !data.has_more_after;
  }

  // Tied to liveFollowing, not showTail: a paused tail snapshot (Live just
  // turned off, e.g. by changing the level filter) is a static view like
  // any other, not "a constantly-moving target" -- only actual continuous
  // auto-refresh makes exporting nonsensical.
  document.getElementById('export').disabled = liveFollowing;
  pasteExportBtn.disabled = liveFollowing;

  if (showTail) logEl.scrollTop = sortDesc ? 0 : logEl.scrollHeight;
}

async function loadStatus() {
  const res = await fetch('/api/status');
  const s = await res.json();
  let extra = '';
  const gapEntries = Object.entries(s.sources).filter(([, v]) => v.total_gaps_detected);
  if (gapEntries.length) {
    extra = '<span>Lücken: ' + gapEntries.map(([n, v]) => `${n} ${v.total_gaps_detected} (${v.total_gaps_recovered} wiederhergestellt)`).join(', ') + '</span>';
  }
  statusEl.innerHTML =
    `<span>Quelle: ${s.source_url}</span>` +
    `<span>Abruf: alle ${s.fetch_interval_seconds}s</span>` +
    `<span>Aufbewahrung: ${s.retention_days}d</span>` +
    `<span>Zeilen: ${s.total_rows}</span>` +
    `<span>Letzter Abruf: ${s.last_fetch_at || '-'}</span>` +
    extra;
  updateAlerts(s);
  updateRetentionStatus(s);
}

// ---- Warnungen/Fehler ("!" Button) ----
// Consolidates what used to be scattered inline spans in the status bar
// (Fehler/Nicht erreichbar/Format-Warnung) into one quiet, on-demand
// place to check -- no popups, badge only shows up when there's actually
// something to see. Also the only place that surfaces actual ERROR-level
// *log content* (recent_error_lines), not just fetch/parse health.
const alertsBtn = document.getElementById('alerts-btn');
let currentAlerts = [];
// Acknowledging: once you've opened the modal and seen the current
// alerts, the badge goes quiet for exactly that set of texts -- persisted
// so it survives a reload. Anything that changes (a new alert appears, or
// an existing one's count changes -- "11 ERROR-Zeile(n)" is a different
// string than "15 ERROR-Zeile(n)") no longer matches, so it lights back
// up on its own without needing a time-based re-alarm.
let acknowledgedAlerts = JSON.parse(localStorage.getItem('acknowledgedAlerts') || '[]');

function updateAlerts(s) {
  const alerts = [];
  if (s.last_error) {
    alerts.push({ type: 'error', text: `Abruf fehlgeschlagen: ${s.last_error}` });
  }
  if (s.retention_job_unhealthy) {
    alerts.push({
      type: 'error',
      text: 'Aufbewahrungsrichtlinie (Retention) schlägt fehl -- alte Daten werden ' +
        'möglicherweise nicht automatisch gelöscht, Speicherplatz prüfen (siehe DEPLOYMENT.md)',
    });
  }
  if (s.compression_job_unhealthy) {
    alerts.push({
      type: 'warning',
      text: 'Komprimierungs-Job schlägt fehl -- ältere Chunks werden möglicherweise ' +
        'nicht automatisch komprimiert, Speicherplatz prüfen',
    });
  }
  for (const [name, v] of Object.entries(s.sources)) {
    if (v.last_error) {
      alerts.push({ type: 'error', text: `${name}: nicht erreichbar (${v.last_error})` });
    }
    if (v.format_mismatch_suspected) {
      alerts.push({ type: 'warning', text: `${name}: viele Zeilen passen nicht zum erwarteten Format` });
    }
    if (v.total_gaps_detected > v.total_gaps_recovered) {
      alerts.push({
        type: 'warning',
        text: `${name}: ${v.total_gaps_detected - v.total_gaps_recovered} Lücke(n) nicht wiederhergestellt -- Zeilen wahrscheinlich verloren`,
      });
    }
    if (v.recent_error_lines > 0) {
      alerts.push({ type: 'warning', text: `${name}: ${v.recent_error_lines} ERROR-Zeile(n) in der letzten Stunde` });
    }
  }
  currentAlerts = alerts;
  const unseen = alerts.filter(a => !acknowledgedAlerts.includes(a.text));
  alertsBtn.classList.toggle('has-alerts', unseen.length > 0);
  alertsBtn.dataset.count = unseen.length;
  alertsBtn.title = !alerts.length
    ? 'Keine aktuellen Fehler oder Warnungen'
    : unseen.length
    ? `${unseen.length} neue Warnung(en) -- klicken zum Anzeigen`
    : `${alerts.length} Warnung(en) (bereits gesehen) -- klicken zum Anzeigen`;
}

alertsBtn.onclick = () => {
  if (!currentAlerts.length) {
    showToast('Keine aktuellen Fehler oder Warnungen.', 'ok');
    return;
  }
  acknowledgedAlerts = currentAlerts.map(a => a.text);
  localStorage.setItem('acknowledgedAlerts', JSON.stringify(acknowledgedAlerts));
  alertsBtn.classList.remove('has-alerts');
  alertsBtn.dataset.count = 0;
  const modal = openModal(`
    <p>Aktuelle Fehler/Warnungen:</p>
    <ul class="alerts-list"></ul>
    <div class="modal-actions"><button data-action="close">Schließen</button></div>
  `);
  modal.overlay.querySelector('.alerts-list').innerHTML =
    currentAlerts.map(a => `<li class="${a.type}">${escapeHtml(a.text)}</li>`).join('');
  modal.overlay.addEventListener('click', (ev) => {
    if (ev.target.dataset && ev.target.dataset.action === 'close') modal.close();
  });
};

function restartLiveTimer() {
  if (liveTimer) clearInterval(liveTimer);
  liveTimer = setInterval(() => {
    if (!hasCustomRange() && dayEl.value === '__today__' && liveEl.checked) load();
  }, 5000);
}

liveEl.onchange = () => { if (!hasCustomRange() && dayEl.value === '__today__') load(); };

document.getElementById('prev').onclick = () => {
  if (!firstShown) return;
  liveEl.checked = false;
  pendingCursor = { before: firstShown };
  load();
};
document.getElementById('next').onclick = () => {
  if (!lastShown) return;
  liveEl.checked = false;
  pendingCursor = { after: lastShown };
  load();
};
sourceEl.onchange = async () => { pendingCursor = null; await loadDates(); await loadLevels(); load(); };
dayEl.onchange = () => { pendingCursor = null; load(); };
levelEl.onchange = () => { liveEl.checked = false; pendingCursor = null; load(); };
let searchDebounce;
searchEl.oninput = () => {
  liveEl.checked = false;
  pendingCursor = null;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(load, 300);
};

// Scrolling away from the live edge (bottom in the default oldest-first
// order, top when the newest-first toggle is on) pauses live-follow, same
// as älter/neuer/level/search/Zeitraum -- otherwise the next 5s auto-
// refresh (or auto-scroll) would yank the view out from under you mid-read.
// Only reacts when actually live, so our own auto-scroll (which lands
// exactly on that edge) never triggers it.
logEl.addEventListener('scroll', () => {
  if (!liveEl.checked) return;
  const atBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 4;
  const atTop = logEl.scrollTop <= 4;
  if (!(sortDesc ? atTop : atBottom)) liveEl.checked = false;
});

// Export always covers exactly the active filter (source/day-or-Zeitraum/
// level/search) -- no separate line-range concept, which stopped
// corresponding to anything visible once paging became cursor-based (see
// CHANGELOG). Both buttons are disabled while live-following, since
// exporting a constantly-moving target doesn't make sense -- see load().
function exportParams() {
  const p = params({});
  if (!hasCustomRange()) {
    const isToday = dayEl.value === '__today__';
    p.set('day', isToday ? new Date().toISOString().slice(0, 10) : dayEl.value);
  }
  return p;
}

document.getElementById('export').onclick = () => {
  const p = exportParams();
  if (exportGzipEl.checked) p.set('gzip', 'true');
  window.open('/api/logs/export?' + p.toString(), '_blank');
};

const pasteExportBtn = document.getElementById('paste-export');
pasteExportBtn.onclick = async () => {
  pasteExportBtn.disabled = true;
  const originalText = pasteExportBtn.textContent;
  pasteExportBtn.textContent = 'Wird gesendet...';
  try {
    const res = await fetch('/api/logs/export/paste?' + exportParams().toString(), { method: 'POST' });
    const data = await res.json();
    if (!res.ok) {
      showToast(data.detail || 'Senden an Paste fehlgeschlagen', 'error', { sticky: true });
      return;
    }
    let copied = false;
    try { await navigator.clipboard.writeText(data.url); copied = true; } catch (e) { /* clipboard unavailable */ }
    showLink(copied ? 'Link (in Zwischenablage kopiert):' : 'Link:', data.url);
  } catch (e) {
    showToast('Senden an Paste fehlgeschlagen: ' + e.message, 'error', { sticky: true });
  } finally {
    pasteExportBtn.disabled = false;
    pasteExportBtn.textContent = originalText;
  }
};

const fetchNowBtn = document.getElementById('fetch-now');
fetchNowBtn.onclick = async () => {
  fetchNowBtn.disabled = true;
  const originalText = fetchNowBtn.textContent;
  fetchNowBtn.textContent = 'Wird abgerufen...';
  try {
    await fetch('/api/fetch-now', { method: 'POST' });
    await load();
    await loadStatus();
  } finally {
    fetchNowBtn.disabled = false;
    fetchNowBtn.textContent = originalText;
  }
};

// ---- Einstellungen ----
const backdrop = document.getElementById('settings-backdrop');
const msgEl = document.getElementById('settings-msg');

async function openSettings() {
  msgEl.textContent = '';
  msgEl.className = '';
  const res = await fetch('/api/settings');
  const data = await res.json();
  document.getElementById('s-base-url').value = data.settings.openwb_base_url;
  document.getElementById('s-ramdisk').value = data.settings.openwb_ramdisk_path;
  document.getElementById('s-interval').value = data.settings.fetch_interval_seconds;
  document.getElementById('s-retention').value = data.settings.retention_days;
  document.getElementById('s-page-size').value = data.settings.page_size;
  const usesCustomPaste = data.settings.paste_upload_url !== PASTE_DEFAULT_UPLOAD_URL ||
    data.settings.paste_view_url !== PASTE_DEFAULT_VIEW_URL;
  document.getElementById('s-paste-custom').checked = usesCustomPaste;
  document.getElementById('s-paste-custom-fields').style.display = usesCustomPaste ? 'block' : 'none';
  document.getElementById('s-paste-upload').value = data.settings.paste_upload_url;
  document.getElementById('s-paste-view').value = data.settings.paste_view_url;

  const box = document.getElementById('s-sources');
  box.innerHTML = '';
  for (const src of data.catalog) {
    const id = 'src-' + src.name;
    const wrap = document.createElement('label');
    const checked = data.settings.enabled_sources.includes(src.name) ? 'checked' : '';
    wrap.innerHTML = `<input type="checkbox" id="${id}" value="${src.name}" ${checked}> ${src.label} <span style="color:var(--muted)">(${src.format})</span>`;
    box.appendChild(wrap);
  }
  await loadUpdateInfo();
  backdrop.classList.add('open');
}

function closeSettings() { backdrop.classList.remove('open'); }

document.getElementById('settings-open').onclick = openSettings;
document.getElementById('settings-cancel').onclick = closeSettings;
backdrop.onclick = (e) => { if (e.target === backdrop) closeSettings(); };

document.getElementById('settings-save').onclick = async () => {
  const enabled = [...document.querySelectorAll('#s-sources input:checked')].map(el => el.value);
  const useCustomPaste = document.getElementById('s-paste-custom').checked;
  const patch = {
    openwb_base_url: document.getElementById('s-base-url').value,
    openwb_ramdisk_path: document.getElementById('s-ramdisk').value,
    enabled_sources: enabled,
    fetch_interval_seconds: parseInt(document.getElementById('s-interval').value, 10),
    retention_days: parseInt(document.getElementById('s-retention').value, 10),
    page_size: parseInt(document.getElementById('s-page-size').value, 10),
    paste_upload_url: useCustomPaste
      ? document.getElementById('s-paste-upload').value
      : PASTE_DEFAULT_UPLOAD_URL,
    paste_view_url: useCustomPaste
      ? document.getElementById('s-paste-view').value
      : PASTE_DEFAULT_VIEW_URL,
  };
  const res = await fetch('/api/settings', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(patch),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    msgEl.textContent = err.detail || 'Einstellungen konnten nicht gespeichert werden';
    msgEl.className = 'error';
    return;
  }
  const saved = await res.json();
  LIMIT = saved.settings.page_size;
  msgEl.textContent = 'Gespeichert. Wird sofort wirksam.';
  msgEl.className = 'ok';
  await loadSources();
  await loadDates();
  await loadLevels();
  pendingCursor = null;
  await load();
  await loadStatus();
  setTimeout(closeSettings, 900);
};

// ---- Update ----
const updateBtn = document.getElementById('update-btn');
const updateCheckBtn = document.getElementById('update-check');
const updateCommitEl = document.getElementById('update-commit');
const updateMsgEl = document.getElementById('update-msg');

async function loadUpdateInfo() {
  updateMsgEl.textContent = '';
  updateMsgEl.className = '';
  const res = await fetch('/api/update/version');
  const data = await res.json();
  updateCommitEl.textContent = data.current_commit ? data.current_commit : '-';
  // Hidden, not just disabled, when there's no bind-mounted git checkout to
  // update in place (e.g. a plain `image:` deployment) -- a permanently
  // dead button is just clutter, not a useful affordance to grey out.
  updateBtn.style.display = data.available ? '' : 'none';
  updateCheckBtn.style.display = data.available ? '' : 'none';
}

updateCheckBtn.onclick = async () => {
  updateMsgEl.textContent = 'Suche nach Updates...';
  updateMsgEl.className = '';
  const data = await (await fetch('/api/update/check')).json();
  if (data.error) {
    updateMsgEl.textContent = 'Prüfung fehlgeschlagen: ' + data.error;
    updateMsgEl.className = 'error';
    return;
  }
  updateMsgEl.textContent = data.update_available
    ? `Update verfügbar (${data.current} → ${data.latest})`
    : `Aktuell (${data.current})`;
  updateMsgEl.className = 'ok';
};

async function waitForRestartThenReload() {
  // docker-compose's restart policy brings the process back within a
  // second or two -- poll until it answers again, then reload so the
  // (possibly also-updated) frontend gets refreshed too.
  for (let i = 0; i < 30; i++) {
    await new Promise(r => setTimeout(r, 1000));
    try {
      if ((await fetch('/api/status')).ok) { window.location.reload(); return; }
    } catch (e) { /* still restarting */ }
  }
  updateMsgEl.textContent = 'Startet noch... bitte in Kürze manuell neu laden.';
}

updateBtn.onclick = async () => {
  if (!(await showConfirm('Neueste Version laden und die Anwendung jetzt neu starten?'))) return;
  updateBtn.disabled = true;
  const originalText = updateBtn.textContent;
  updateBtn.textContent = 'Wird aktualisiert...';
  try {
    const result = await (await fetch('/api/update', { method: 'POST' })).json();
    if (!result.ok) {
      updateMsgEl.textContent = 'Update fehlgeschlagen: ' + result.message;
      updateMsgEl.className = 'error';
      return;
    }
    if (result.restarting) {
      updateMsgEl.textContent = 'Startet neu...';
      updateMsgEl.className = 'ok';
      await waitForRestartThenReload();
      return;
    }
    updateMsgEl.textContent = result.message;
    updateMsgEl.className = 'ok';
  } finally {
    updateBtn.disabled = false;
    updateBtn.textContent = originalText;
  }
};

// ---- Retention-Job ----
// TimescaleDB's own retention job can get permanently stuck failing every
// run (a dangling internal catalog reference to an already-dropped chunk
// -- see DEPLOYMENT.md). Detecting it is safe to do continuously
// (retention_job_unhealthy from /api/status); the actual repair pokes at
// TimescaleDB's undocumented internal tables, so it stays an explicit,
// confirmed button click rather than something run automatically.
const retentionStatusEl = document.getElementById('retention-status');
const retentionRepairBtn = document.getElementById('retention-repair-btn');
const retentionMsgEl = document.getElementById('retention-msg');

function updateRetentionStatus(s) {
  retentionMsgEl.textContent = '';
  retentionMsgEl.className = '';
  if (s.retention_job_unhealthy) {
    retentionStatusEl.textContent = 'Fehlgeschlagen';
    retentionStatusEl.className = 'unhealthy';
    retentionRepairBtn.style.display = '';
  } else {
    retentionStatusEl.textContent = 'OK';
    retentionStatusEl.className = '';
    retentionRepairBtn.style.display = 'none';
  }
}

retentionRepairBtn.onclick = async () => {
  if (!(await showConfirm(
    'Verwaiste Retention-Katalogeinträge bereinigen? Entfernt nur Metadaten ' +
    'bereits gelöschter Chunks, keine echten Log-Daten.'
  ))) return;
  retentionRepairBtn.disabled = true;
  try {
    const res = await fetch('/api/retention/repair', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) {
      retentionMsgEl.textContent = 'Reparatur fehlgeschlagen: ' + (data.detail || res.status);
      retentionMsgEl.className = 'error';
      return;
    }
    retentionMsgEl.textContent = data.removed > 0
      ? `${data.removed} verwaiste Einträge entfernt.`
      : 'Keine verwaisten Einträge gefunden.';
    retentionMsgEl.className = 'ok';
  } catch (e) {
    retentionMsgEl.textContent = 'Reparatur fehlgeschlagen: ' + e.message;
    retentionMsgEl.className = 'error';
  } finally {
    retentionRepairBtn.disabled = false;
  }
};

(async function init() {
  updateRangeUI();
  const settingsRes = await fetch('/api/settings');
  LIMIT = (await settingsRes.json()).settings.page_size;
  await loadSources();
  await loadDates();
  await loadLevels();
  await load();
  await loadStatus();
  restartLiveTimer();
  setInterval(loadStatus, 5000);
})();
</script>
